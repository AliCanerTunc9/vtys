name: vtys

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vtys}
      MYSQL_USER: ${MYSQL_USER:-vtys}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  nextjs:
    image: node:22-bookworm-slim
    working_dir: /app
    init: true
    command:
      - sh
      - -ec
      - |
        if [ ! -x node_modules/.bin/next ]; then
          npm ci
        fi
        exec npm run dev -- --hostname 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-vtys}
      DB_USER: ${MYSQL_USER:-vtys}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./nextjs:/app
      - nextjs_node_modules:/app/node_modules
      - nextjs_cache:/app/.next
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  nextjs_node_modules:
  nextjs_cache:
